name: Manage Dev Runtime

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Start or stop the isolated dev runtime"
        required: true
        type: choice
        options: [start, stop]

jobs:
  manage-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Manage dev containers over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/wp-stack/docker
            case "${{ inputs.action }}" in
              start)
                docker compose --profile dev up -d db-dev php-dev
                docker compose --profile edge up -d nginx
                ;;
              stop)
                docker compose --profile dev stop php-dev db-dev
                ;;
            esac