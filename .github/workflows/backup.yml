name: Backup

on:
  schedule:
    - cron: "0 9 * * *" # daily, 09:00 UTC — prod
    - cron: "0 10 * * 1" # weekly Monday, 10:00 UTC — dev (less critical, less often)
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to back up"
        required: true
        type: choice
        options: [dev, prod]
        default: prod

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'prod' }}
    steps:
      - name: Run backup over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            TARGET_ENV="${{ github.event.inputs.environment || 'prod' }}"
            cd /opt/wp-stack/docker
            mkdir -p ~/.oci
            echo "${{ secrets.OCI_CLI_CONFIG }}" > ~/.oci/config
            echo "${{ secrets.OCI_CLI_KEY }}" > ~/.oci/oci_api_key.pem
            chmod 600 ~/.oci/oci_api_key.pem

            # Backups bucket + prefix are shared knowledge (docker/.env), but
            # WHICH database/webroot to dump comes from that env's own file.
            source <(grep -E '^(MYSQL_USER|MYSQL_PASSWORD|MYSQL_DATABASE)=' "$TARGET_ENV.env")
            source <(grep OCI_BACKUP_BUCKET .env)

            docker compose --profile tools run --rm \
              -v ~/.oci:/root/.oci:ro \
              -e MYSQL_USER="$MYSQL_USER" \
              -e MYSQL_PASSWORD="$MYSQL_PASSWORD" \
              -e MYSQL_DATABASE="$MYSQL_DATABASE" \
              -e MYSQL_HOST="db-$TARGET_ENV" \
              -e WP_CONTENT_PATH="/var/www/$TARGET_ENV/wp-content" \
              -e OCI_BACKUP_BUCKET="$OCI_BACKUP_BUCKET" \
              -e OCI_BACKUP_PREFIX="$TARGET_ENV" \
              backup
