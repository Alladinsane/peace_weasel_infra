name: Promote Dev to Prod

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PROMOTE_DEV_TO_PROD to replace production with dev"
        required: true
        type: string
      stop_dev_after:
        description: "Destroy the dev VM after promotion"
        required: true
        default: true
        type: boolean

concurrency:
  group: peaceweasel-operations
  cancel-in-progress: false

jobs:
  promote:
    runs-on: [self-hosted, linux, ARM64, peaceweasel]
    environment: prod
    steps:
      - name: Require explicit confirmation
        if: inputs.confirmation != 'PROMOTE_DEV_TO_PROD'
        run: |
          echo "::error::Promotion cancelled: type PROMOTE_DEV_TO_PROD exactly."
          exit 1
      - name: Choose backup timestamp
        id: stamp
        run: echo "stamp=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
      - name: Back up dev to OCI
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_DEV_PRIVATE }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/wp-stack/docker
            mkdir -p ~/.oci
            echo "${{ secrets.OCI_CLI_CONFIG }}" > ~/.oci/config
            echo "${{ secrets.OCI_CLI_KEY }}" > ~/.oci/oci_api_key.pem
            chmod 600 ~/.oci/oci_api_key.pem
            source <(grep -E '^(MYSQL_USER|MYSQL_PASSWORD|MYSQL_DATABASE)=' dev.env)
            source <(grep OCI_BACKUP_BUCKET .env)
            BACKUP_STAMP="${{ steps.stamp.outputs.stamp }}"
            docker compose --profile dev up -d db-dev
            docker compose --profile tools run --rm \
              -v ~/.oci:/root/.oci:ro \
              -e MYSQL_USER="$MYSQL_USER" -e MYSQL_PASSWORD="$MYSQL_PASSWORD" \
              -e MYSQL_DATABASE="$MYSQL_DATABASE" -e MYSQL_HOST=db-dev \
              -e WP_CONTENT_PATH=/var/www/dev/wp-content \
              -e OCI_BACKUP_BUCKET="$OCI_BACKUP_BUCKET" -e OCI_BACKUP_PREFIX=dev \
              -e BACKUP_STAMP="$BACKUP_STAMP" backup
      - name: Back up prod and restore dev into prod
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 127.0.0.1
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/wp-stack/docker
            mkdir -p ~/.oci
            echo "${{ secrets.OCI_CLI_CONFIG }}" > ~/.oci/config
            echo "${{ secrets.OCI_CLI_KEY }}" > ~/.oci/oci_api_key.pem
            chmod 600 ~/.oci/oci_api_key.pem
            source <(grep -E '^(MYSQL_USER|MYSQL_PASSWORD|MYSQL_DATABASE)=' prod.env)
            source <(grep OCI_BACKUP_BUCKET .env)
            DEV_HOST=$(grep -m1 '^DEV_HOST=' .env | cut -d= -f2-)
            PROD_HOST=$(grep -m1 '^PROD_HOST=' .env | cut -d= -f2-)
            docker compose --profile prod up -d db-prod
            docker compose --profile tools run --rm \
              -v ~/.oci:/root/.oci:ro \
              -e MYSQL_USER="$MYSQL_USER" -e MYSQL_PASSWORD="$MYSQL_PASSWORD" \
              -e MYSQL_DATABASE="$MYSQL_DATABASE" -e MYSQL_HOST=db-prod \
              -e WP_CONTENT_PATH=/var/www/prod/wp-content \
              -e OCI_BACKUP_BUCKET="$OCI_BACKUP_BUCKET" -e OCI_BACKUP_PREFIX=prod \
              backup
            docker compose --profile prod stop php-prod || true
            docker compose --profile tools run --rm --entrypoint /restore.sh \
              -v ~/.oci:/root/.oci:ro \
              -e MYSQL_USER="$MYSQL_USER" -e MYSQL_PASSWORD="$MYSQL_PASSWORD" \
              -e MYSQL_DATABASE="$MYSQL_DATABASE" -e MYSQL_HOST=db-prod \
              -e WP_CONTENT_PATH=/var/www/prod/wp-content \
              -e OCI_BACKUP_BUCKET="$OCI_BACKUP_BUCKET" -e OCI_BACKUP_PREFIX=dev \
              -e RESTORE_TARGET_ENV=prod -e RESTORE_STAMP="${{ steps.stamp.outputs.stamp }}" \
              backup
            docker compose --profile tools run --rm wp-cli-prod search-replace \
              "$DEV_HOST" "$PROD_HOST" --all-tables --precise --skip-columns=guid
            docker compose --profile tools run --rm wp-cli-prod option update home "https://$PROD_HOST"
            docker compose --profile tools run --rm wp-cli-prod option update siteurl "https://$PROD_HOST"
            docker compose --profile prod up -d php-prod
      - name: Dev VM teardown reminder
        if: inputs.stop_dev_after == true
        run: echo "Destroy the dev VM with Terraform after this promotion and its final backup."
