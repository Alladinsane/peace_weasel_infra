name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options: [dev, prod]

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, ARM64, "env-${{ inputs.environment }}"]
    environment: ${{ inputs.environment }}
    steps:
      - name: Deploy
        shell: bash
        env:
          BRANCH: ${{ inputs.environment == 'prod' && 'main' || 'dev' }}
          PHP_VERSION: ${{ vars.PHP_VERSION || '8.3' }}
          APP_HOST: ${{ vars.APP_HOST }}
          APP_HOST_ALIASES: ${{ vars.APP_HOST_ALIASES }}
          NGINX_ADMIN_IP: ${{ secrets.NGINX_ADMIN_IP }}
          OCI_BACKUP_BUCKET: ${{ secrets.OCI_BACKUP_BUCKET }}
          CF_ORIGIN_CERT: ${{ secrets.CF_ORIGIN_CERT }}
          CF_ORIGIN_KEY: ${{ secrets.CF_ORIGIN_KEY }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          WORDPRESS_TABLE_PREFIX: ${{ secrets.WORDPRESS_TABLE_PREFIX }}
        run: |
          set -euo pipefail
          cd /opt/wp-stack
          git fetch origin
          git checkout "$BRANCH"
          git pull --ff-only origin "$BRANCH"

          cat > docker/.env <<ENVEOF
          PHP_VERSION=$PHP_VERSION
          APP_HOST=$APP_HOST
          APP_HOST_ALIASES=$APP_HOST_ALIASES
          NGINX_ADMIN_IP=$NGINX_ADMIN_IP
          OCI_BACKUP_BUCKET=$OCI_BACKUP_BUCKET
          ENVEOF

          mkdir -p docker/nginx/certs
          printf '%s\n' "$CF_ORIGIN_CERT" > docker/nginx/certs/cloudflare-origin.pem
          printf '%s\n' "$CF_ORIGIN_KEY" > docker/nginx/certs/cloudflare-origin.key
          chmod 600 docker/nginx/certs/cloudflare-origin.key

          cat > docker/app.env