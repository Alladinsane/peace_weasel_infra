name: Refresh Dev From Prod

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type REFRESH_DEV_FROM_PROD to replace dev with prod"
        required: true
        type: string

concurrency:
  group: peaceweasel-operations
  cancel-in-progress: false

jobs:
  refresh-dev:
    runs-on: [self-hosted, linux, ARM64, peaceweasel]
    environment: prod
    steps:
      - name: Require explicit confirmation
        if: inputs.confirmation != 'REFRESH_DEV_FROM_PROD'
        run: |
          echo "::error::Refresh cancelled: type REFRESH_DEV_FROM_PROD exactly."
          exit 1
      - name: Choose backup timestamp
        id: stamp
        run: echo "stamp=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
      - name: Back up prod to OCI
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 127.0.0.1
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/wp-stack/docker
            mkdir -p ~/.oci
            echo "${{ secrets.OCI_CLI_CONFIG }}" > ~/.oci/config
            echo "${{ secrets.OCI_CLI_KEY }}" > ~/.oci/oci_api_key.pem
            chmod 600 ~/.oci/oci_api_key.pem
            source <(grep -E '^(MYSQL_USER|MYSQL_PASSWORD|MYSQL_DATABASE)=' prod.env)
            source <(grep OCI_BACKUP_BUCKET .env)
            docker compose --profile prod up -d db-prod
            docker compose --profile tools run --rm \
              -v ~/.oci:/root/.oci:ro \
              -e MYSQL_USER="$MYSQL_USER" -e MYSQL_PASSWORD="$MYSQL_PASSWORD" \
              -e MYSQL_DATABASE="$MYSQL_DATABASE" -e MYSQL_HOST=db-prod \
              -e WP_CONTENT_PATH=/var/www/prod/wp-content \
              -e OCI_BACKUP_BUCKET="$OCI_BACKUP_BUCKET" -e OCI_BACKUP_PREFIX=prod \
              -e BACKUP_STAMP="${{ steps.stamp.outputs.stamp }}" backup
      - name: Restore prod into dev
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_DEV_PRIVATE }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/wp-stack/docker
            mkdir -p ~/.oci
            echo "${{ secrets.OCI_CLI_CONFIG }}" > ~/.oci/config
            echo "${{ secrets.OCI_CLI_KEY }}" > ~/.oci/oci_api_key.pem
            chmod 600 ~/.oci/oci_api_key.pem
            source <(grep -E '^(MYSQL_USER|MYSQL_PASSWORD|MYSQL_DATABASE)=' dev.env)
            source <(grep OCI_BACKUP_BUCKET .env)
            docker compose build backup
            PROD_HOST=$(grep -m1 '^PROD_HOST=' .env | cut -d= -f2-)
            DEV_HOST=$(grep -m1 '^DEV_HOST=' .env | cut -d= -f2-)
            docker compose --profile dev up -d db-dev
            docker compose --profile dev stop php-dev || true
            docker compose --profile tools run --rm --entrypoint /restore.sh \
              -v ~/.oci:/root/.oci:ro \
              -e MYSQL_USER="$MYSQL_USER" -e MYSQL_PASSWORD="$MYSQL_PASSWORD" \
              -e MYSQL_DATABASE="$MYSQL_DATABASE" -e MYSQL_HOST=db-dev \
              -e WP_CONTENT_PATH=/var/www/dev/wp-content \
              -e OCI_BACKUP_BUCKET="$OCI_BACKUP_BUCKET" -e OCI_BACKUP_PREFIX=prod \
              -e RESTORE_TARGET_ENV=dev -e RESTORE_STAMP="${{ steps.stamp.outputs.stamp }}" \
              backup
            docker compose --profile tools run --rm wp-cli-dev search-replace \
              "$PROD_HOST" "$DEV_HOST" --all-tables --precise --skip-columns=guid
            docker compose --profile tools run --rm wp-cli-dev option update home "https://$DEV_HOST"
            docker compose --profile tools run --rm wp-cli-dev option update siteurl "https://$DEV_HOST"
            docker compose --profile dev up -d php-dev
