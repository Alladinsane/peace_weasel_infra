services:
  db:
    image: mariadb:11
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.65"
          memory: 2G
        reservations:
          cpus: "0.1"
          memory: 512M
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    env_file: app.env
    volumes:
      - db_data:/var/lib/mysql
    networks: [wpnet]

  php:
    build:
      context: ./php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 1.5G
        reservations:
          cpus: "0.05"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    env_file: app.env
    volumes:
      - wp_data:/var/www/html
    depends_on: [db]
    networks: [wpnet]

  # This box's only edge listener. Knows nothing about the other box —
  # no other environment's host, volumes, or upstream ever appear here.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 128M
        reservations:
          cpus: "0.02"
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "80:80"
      - "443:443"
    environment:
      NGINX_ADMIN_IP: ${NGINX_ADMIN_IP}
      APP_HOST: ${APP_HOST}
      APP_HOST_ALIASES: ${APP_HOST_ALIASES}
    volumes:
      - wp_data:/var/www/html:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on: [php]
    networks: [wpnet]

  backup:
    build:
      context: ../scripts
      dockerfile: Dockerfile.backup
    profiles: ["tools"]
    env_file: app.env
    volumes:
      - wp_data:/var/www/html
    networks: [wpnet]

  wp-cli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    user: "0:0"
    env_file: app.env
    entrypoint: ["wp", "--path=/var/www/html", "--allow-root"]
    volumes:
      - wp_data:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/conf.d/zz-wp-tuning.ini:ro
    networks: [wpnet]

networks:
  wpnet:

volumes:
  db_data:
  wp_data: