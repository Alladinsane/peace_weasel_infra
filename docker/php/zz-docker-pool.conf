[www]
; Use ondemand to keep RAM usage close to 0 when idle
pm = ondemand

; Hard limit of 5 workers (~500MB-750MB RAM ceiling under heavy WooCommerce load)
pm.max_children = 5

; Terminate idle workers after 10s of inactivity to free RAM back to MariaDB
pm.process_idle_timeout = 10s

; Recycle workers after 500 requests to prevent PHP plugin memory leaks
pm.max_requests = 500

; Capture worker output for docker logs
catch_workers_output = yes
decorate_workers_output = no

; Terminate slow hanging requests (matches our php.ini max_execution_time)
request_terminate_timeout = 60s